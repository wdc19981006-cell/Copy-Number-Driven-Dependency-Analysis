name: R synthetic validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.0'
          use-public-rspm: true
      - name: Restore locked test dependencies only
        shell: Rscript {0}
        run: |
          stopifnot(as.character(getRversion()) == '4.5.0')
          source('.Rprofile')
          renv::restore(packages = c('data.table', 'dplyr', 'ggplot2'), prompt = FALSE)
      - name: Synthetic and unchanged-core tests (no TCGA or DepMap data)
        run: Rscript --vanilla tests/run_synthetic_tests.R
